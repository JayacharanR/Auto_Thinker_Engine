# Experiment Contract
# Documents the setup the code actually runs; no script reads this file.
# Where a value is set in code or another config, that location is named and
# is authoritative. Keep this file in sync when those change.

backend:
  name: dreamerv3-torch
  path: third_party/dreamerv3_torch          # + patches/dreamerv3_torch_compat.patch
  framework: pytorch
tasks_from: third_party/CarDreamer            # + patches/cardreamer_compat.patch

python_version: "3.10"
carla_version: "0.9.15"                       # Town03_Opt default map: scripts/configure_carla.sh
torch: "2.11 (cu128)"                         # pyproject.toml

# Observation and action contracts (scripts/train_cardreamer.py --obs/--action,
# src/dreamer/carla_wrappers.py).
stages:
  first_working_car:                          # Stage 3: prove the loop learns
    task: carla_right_turn_simple
    obs: bev                                  # birdeye_wpt -> image 64x64 (route drawn in)
    action: discrete                          # CarDreamer action table, one-hot actor
    arms: [cnn]
  encoder_comparison:                         # Stage 5
    task: carla_right_turn_simple
    obs: camera_route                         # front camera -> image 64x64, + route vector
    action: continuous                        # [acceleration, steering] in [-1, 1]
    arms: [cnn, custom_jepa, vjepa2]

observation:
  image: [64, 64, 3]                          # uint8, channel-last; decoder target for all arms
  route: 23                                   # 10 ego-frame waypoints (every 4th, ~30 m), speed, sin/cos heading
  feat: encoder dim                           # frozen arms only: embedding computed per env step

episode:
  time_limit: 500                             # CarDreamer terminal.time_limit (a truncation)
  terminal: [is_collision, out_of_lane, destination_reached]
  action_repeat: 1                            # CARLA fixed 0.1 s step

encoders:                                     # configs/phase3_transfer_arms.yaml
  cnn: dreamerv3-torch MultiEncoder (trained)
  custom_jepa: Phase 2 ViT-S, frozen, geometry/normalisation from its checkpoint config
  vjepa2: facebook/vjepa2-vitl-fpc64-256, frozen
  route_branch: dreamerv3-torch MLP over `route`, identical for every arm
  adapter_target_dim: 1024                    # frozen arms: trainable adapter over `feat`

dreamer: configs/laptop.yaml                  # overrides on dreamerv3-torch defaults;
                                              # effective values in each run's manifest.json

experiment:
  seeds: [42, 123, 456]                       # configs/phase3_transfer_arms.yaml
  eval_every: 10000                           # configs/laptop.yaml
  eval_episodes: 10
  success_threshold: 0.8                      # steps_to_threshold in comparison.json

metrics:                                      # per run: episodes.jsonl, eval.jsonl, metrics.json
  per_episode: [return, length, termination, success, collision, out_of_lane,
                time_exceeded, avg_speed_kmh, wall_clock_sec, peak_vram_mb]
  comparison: [success_rate, collision_rate, out_of_lane_rate, eval_return,
               steps_to_threshold, wall_clock_hours, peak_vram_gb, train_steps_per_sec]

reward_source: cardreamer_wpt                 # CarDreamer carla_wpt_env reward
