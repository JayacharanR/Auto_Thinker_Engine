# Separate research contract; does not change the historical Dreamer experiments.
version: navigation-v1
carla_version: "0.9.15"
stage: M0
benchmark_frozen: false
runtime:
  host: 127.0.0.1
  port: 2100
  traffic_manager_port: 8100
  physics_hz: 20
  camera_hz: 20
  history_hz: 10
  planner_hz: 5
  sensor_timeout_seconds: 10
  max_wall_seconds: 1800
  minimum_free_gb: 25
  # Measured 2026-10-09 with one server: 88% CPU idle (24 cores), GPU 11-17%,
  # ~3.5 GB VRAM and ~4 GB RAM per server+evaluator. Parallel slots use
  # port/TM port + slot * slot_port_stride; each start is resource-gated.
  max_servers: 3
  slot_port_stride: 100
  minimum_free_vram_gb: 3.0
  minimum_available_ram_gb: 6.0
camera:
  width: 512
  height: 288
  fov: 100
  x: 1.3
  y: 0.0
  z: 2.3
  pitch: 0.0
  roll: 0.0
  views:
    front: 0.0
    left: -60.0
    right: 60.0
policy_inputs:
  - rgb
  - camera_calibration
  - navigation_waypoints
  - ego_motion
  - timestamps
privileged_inputs: training_and_scoring_only
planning:
  horizon_seconds: 4.0
  waypoints: 8
  path_candidates: 3
  speed_candidates: 5
  predictor_baseline: constant_velocity
  dynamics_ensemble_members: 3
data:
  train_towns: [Town01, Town02, Town03, Town04, Town10HD]
  holdout_town: Town05
  initial_timestamps: 20000
  maximum_timestamps: 100000
  nominal_encounter_seconds: [20, 40]
  # Whole episodes are split before clips; these fractions also budget perception labels.
  label_fractions: [0.05, 0.10, 0.25, 1.0]
evaluation:
  development_encounters: 300
  encounters_per_family: 50
  families: [signal_stop, signal_release_memory, stop_sign, crossing_yield,
             following_stopped_vehicle, route_junction]
  final_routes: 12
  final_route_length_m: [1000, 3000]
  traffic_seeds: [3031, 4031, 5031]
  minimum_stop_opportunities: 30
  minimum_red_opportunities: 30
  stop_sign_locations: 5
  count_all_collisions: true
  learned_policy_ablation_disables: [rule_overrides, emergency_overrides]
  stretch_target_safe_routes: 33
  # This target is not a statistical safety guarantee or an M0 pass criterion.
encoders: [jepa_carla, jepa_comma2k19, dinov2_small, imagenet_resnet18, cnn_scratch]
training_seeds: [42, 123, 456]
